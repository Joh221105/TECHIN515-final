<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PSSS Leak Sensor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:      #080b10;
  --surface: #0e1420;
  --border:  #1a2235;
  --text:    #e2e8f0;
  --muted:   #4a5870;
  --accent:  #00e5ff;
  --warn:    #ff4757;
  --ok:      #00e676;
  --mono:    'Space Mono', monospace;
  --sans:    'Syne', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  height: 100%;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 999; pointer-events: none;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
  );
}

#app {
  display: grid;
  grid-template-rows: 64px 1fr;
  height: 100vh;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.logo {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--sans); font-weight: 800; font-size: 1.15rem;
  letter-spacing: 0.08em; color: var(--accent);
  text-transform: uppercase;
}
.logo-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--muted);
  transition: background 0.3s, box-shadow 0.3s;
}
.logo-dot.connected {
  background: var(--ok);
  box-shadow: 0 0 8px var(--ok);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.7); }
}

.header-right { display: flex; align-items: center; gap: 10px; }

.btn {
  font-family: var(--mono);
  font-size: 0.8rem; font-weight: 700;
  letter-spacing: 0.06em;
  border: none; border-radius: 4px;
  padding: 8px 18px;
  cursor: pointer;
  text-transform: uppercase;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-connect    { background: var(--accent); color: var(--bg); }
.btn-disconnect { background: transparent; border: 1px solid var(--warn); color: var(--warn); }

.status-text {
  font-family: var(--mono); font-size: 0.78rem; color: var(--muted);
}

/* ── Main layout ── */
main {
  display: grid;
  grid-template-columns: 1fr 300px;
  overflow: hidden;
  min-height: 0;
}

/* ── Heatmap ── */
.canvas-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(0,229,255,0.03) 0%, transparent 60%),
    var(--bg);
  overflow: hidden;
}
.canvas-wrap::after {
  content: '';
  position: absolute; inset: 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  pointer-events: none;
}

#thermal-canvas {
  display: block;
  width: min(78vw, 980px);
  height: auto;
  aspect-ratio: 4 / 3;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 4px;
  position: relative; z-index: 1;
}

/* Colorbar */
#colorbar-wrap {
  position: absolute;
  right: 30px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  z-index: 2;
}
#colorbar-canvas { width: 12px; height: 180px; border-radius: 2px; border: 1px solid var(--border); }
.cb-label { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }

/* Idle overlay */
#idle-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  background: var(--bg);
  z-index: 10;
  transition: opacity 0.5s;
}
#idle-overlay.hidden { opacity: 0; pointer-events: none; }
.idle-icon { font-size: 2.5rem; animation: float 3s ease-in-out infinite; }
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
.idle-text { font-family: var(--mono); font-size: 0.9rem; color: var(--muted); letter-spacing: 0.08em; }

/* ── Right panel ── */
.right-panel {
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
}

/* ── Leak status ── */
.leak-section {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  gap: 14px;
  border-bottom: 1px solid var(--border);
}

.section-label {
  font-family: var(--mono); font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase;
  align-self: flex-start;
}

.leak-badge {
  width: 100%;
  padding: 18px 10px;
  border-radius: 8px;
  border: 2px solid var(--ok);
  background: rgba(0,230,118,0.06);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  transition: border-color 0.3s, background 0.3s;
}
.leak-badge.leak {
  border-color: var(--warn);
  background: rgba(255,71,87,0.08);
  animation: blink-badge 0.9s step-end infinite;
}
@keyframes blink-badge {
  0%,100% { opacity: 1; } 50% { opacity: 0.55; }
}

.leak-icon { font-size: 2.2rem; line-height: 1; }
.leak-text {
  font-family: var(--sans); font-size: 1.35rem; font-weight: 800;
  letter-spacing: 0.06em; color: var(--ok); text-transform: uppercase;
}
.leak-badge.leak .leak-text { color: var(--warn); }

/* ── Mic / acoustic section ── */
.mic-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px;
  gap: 16px;
  min-height: 0;
  overflow: hidden;
}

.snr-row {
  display: flex; align-items: baseline; gap: 8px;
}
.snr-number {
  font-family: var(--mono); font-size: 2.4rem; font-weight: 700;
  color: var(--text); letter-spacing: -0.02em;
  transition: color 0.3s;
}
.snr-number.leak { color: var(--warn); }
.snr-unit { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }

.spectrum-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}
.spectrum-bars {
  flex: 1;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  min-height: 0;
}
.spec-bar {
  flex: 1;
  border-radius: 2px 2px 0 0;
  background: var(--border);
  min-height: 2px;
  transition: height 0.12s ease-out, background 0.2s;
}
.spec-bar.active      { background: var(--accent); box-shadow: 0 0 4px rgba(0,229,255,0.4); }
.spec-bar.active.leak { background: var(--warn);   box-shadow: 0 0 4px rgba(255,71,87,0.4); }

.spectrum-footer {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
}

.snr-threshold {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 0.75rem; color: var(--muted);
}
.threshold-pip { width: 10px; height: 2px; background: var(--warn); border-radius: 1px; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-dot" id="logo-dot"></div>
      PSSS
    </div>
    <div class="header-right">
      <span class="status-text" id="status-text">Disconnected</span>
      <button type="button" class="btn btn-connect" id="btn-connect-ble" style="background:var(--ok);color:var(--bg);">Connect BLE</button>
      <button type="button" class="btn btn-disconnect" id="btn-disconnect" disabled>Disconnect</button>
    </div>
  </header>

  <!-- Main -->
  <main>
    <!-- Heatmap -->
    <div class="canvas-wrap">
      <div id="idle-overlay">
        <div class="idle-text">Connect via BLE to begin streaming</div>
      </div>
      <canvas id="thermal-canvas" width="32" height="24"></canvas>
      <div id="colorbar-wrap">
        <span class="cb-label" id="cb-max">—</span>
        <canvas id="colorbar-canvas" width="10" height="160"></canvas>
        <span class="cb-label" id="cb-min">—</span>
      </div>
    </div>

    <!-- Right panel -->
    <div class="right-panel">

      <!-- Leak detection -->
      <div class="leak-section">
        <span class="section-label">Detection</span>
        <div class="leak-badge" id="leak-badge">
          <div class="leak-icon" id="leak-icon">✓</div>
          <div class="leak-text" id="leak-text">NO LEAK</div>
        </div>
      </div>

      <!-- Microphone -->
      <div class="mic-section">
        <span class="section-label">Microphone</span>
        <div class="snr-row">
          <span class="snr-number" id="snr-number">—</span>
          <span class="snr-unit">dB SNR</span>
        </div>
        <div class="snr-threshold">
          <div class="threshold-pip"></div>
          Threshold: 6 dB
        </div>
        <div class="spectrum-wrap">
          <div class="spectrum-bars" id="spectrum-bars"></div>
          <div class="spectrum-footer">
            <span>10 kHz</span><span>49 kHz</span>
          </div>
        </div>
      </div>

    </div>
  </main>

</div>
<script>
'use strict';

const SPEC_BINS      = 24;
const DEFAULT_THERMAL_W = 16;
const DEFAULT_THERMAL_H = 12;
const WS_URL = 'ws://localhost:8765';

const CMAP_STOPS = [0, 0.25, 0.5, 0.75, 1];
const CMAP_R     = [0,   0,   0, 255, 255];
const CMAP_G     = [0, 255, 255, 255,   0];
const CMAP_B     = [255,255,   0,   0,   0];

let lastTemps = null;
let thermalW = DEFAULT_THERMAL_W;
let thermalH = DEFAULT_THERMAL_H;
let thermalDirty  = false;
let wsConn        = null;
let thermalTsMs   = null;
let lastRenderAt  = 0;
let thermalFps    = 0;

// DOM
const logoDot       = document.getElementById('logo-dot');
const statusText    = document.getElementById('status-text');
const btnConnectBle = document.getElementById('btn-connect-ble');
const btnDisconnect = document.getElementById('btn-disconnect');
const idleOverlay   = document.getElementById('idle-overlay');
const leakBadge     = document.getElementById('leak-badge');
const leakIcon      = document.getElementById('leak-icon');
const leakText      = document.getElementById('leak-text');
const snrNumber     = document.getElementById('snr-number');

// Build 24 spectrum bars
const specBarsEl = document.getElementById('spectrum-bars');
const specBars = Array.from({ length: SPEC_BINS }, () => {
  const b = document.createElement('div');
  b.className = 'spec-bar';
  specBarsEl.appendChild(b);
  return b;
});

function updateSpectrum(spectrum, acousticAlert) {
  const containerH = specBarsEl.clientHeight || 100;
  specBars.forEach((b, i) => {
    const val = spectrum ? spectrum[i] : 0;
    const h = Math.max(2, (val / 255) * containerH);
    b.style.height = h + 'px';
    b.className = val > 20
      ? ('spec-bar active' + (acousticAlert ? ' leak' : ''))
      : 'spec-bar';
  });
}

function interp(t, xs, ys) {
  if (t <= xs[0]) return ys[0];
  if (t >= xs[xs.length-1]) return ys[xs.length-1];
  for (let i = 0; i < xs.length-1; i++) {
    if (t <= xs[i+1]) {
      const u = (t - xs[i]) / (xs[i+1] - xs[i]);
      return ys[i] + u * (ys[i+1] - ys[i]);
    }
  }
  return ys[ys.length-1];
}

function cmap(norm) {
  const t = Math.max(0, Math.min(1, norm));
  return [
    Math.round(interp(t, CMAP_STOPS, CMAP_R)),
    Math.round(interp(t, CMAP_STOPS, CMAP_G)),
    Math.round(interp(t, CMAP_STOPS, CMAP_B)),
  ];
}

const CMAP_LUT = new Uint8ClampedArray(256 * 3);
for (let i = 0; i < 256; i++) {
  const [r, g, b] = cmap(i / 255);
  const j = i * 3;
  CMAP_LUT[j] = r;
  CMAP_LUT[j + 1] = g;
  CMAP_LUT[j + 2] = b;
}

function cmapLut(norm) {
  const idx = Math.max(0, Math.min(255, Math.round(norm * 255)));
  const p = idx * 3;
  return [CMAP_LUT[p], CMAP_LUT[p + 1], CMAP_LUT[p + 2]];
}

function drawColorbar(tMin, tMax) {
  const el = document.getElementById('colorbar-canvas');
  const ctx = el.getContext('2d');
  const h = el.height;
  const img = ctx.createImageData(1, h);
  for (let i = 0; i < h; i++) {
    const rgb = cmapLut(1 - i / h);
    const p = i * 4;
    img.data[p] = rgb[0]; img.data[p+1] = rgb[1]; img.data[p+2] = rgb[2]; img.data[p+3] = 255;
  }
  const tmp = document.createElement('canvas');
  tmp.width = 1; tmp.height = h;
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.drawImage(tmp, 0, 0, el.width, h);
  document.getElementById('cb-max').textContent = tMax.toFixed(1) + '°C';
  document.getElementById('cb-min').textContent = tMin.toFixed(1) + '°C';
}

function drawThermalCanvas(temps, gw, gh) {
  const canvas = document.getElementById('thermal-canvas');
  if (!canvas || !temps || !gw || !gh || temps.length !== gw * gh) return;
  const ctx = canvas.getContext('2d');
  canvas.width = gw;
  canvas.height = gh;
  const img = ctx.createImageData(gw, gh);
  const d = img.data;

  let minT = Infinity, maxT = -Infinity;
  for (let i = 0; i < temps.length; i++) {
    if (temps[i] < minT) minT = temps[i];
    if (temps[i] > maxT) maxT = temps[i];
  }
  const pad = Math.max((maxT - minT) * 0.1, 0.5);
  const tMin = minT - pad, tMax = maxT + pad;
  const range = Math.max(tMax - tMin, 0.01);

  for (let y = 0; y < gh; y++) {
    for (let x = 0; x < gw; x++) {
      const t = temps[y * gw + x];
      const rgb = cmapLut((t - tMin) / range);
      const p = (y * gw + x) * 4;
      d[p] = rgb[0]; d[p+1] = rgb[1]; d[p+2] = rgb[2]; d[p+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  drawColorbar(tMin, tMax);
  idleOverlay.classList.add('hidden');
}

// $PSSS,status,snr_db,peak_freq,obj_temp,spec[0],...,spec[23]*
function parsePsssLine(line) {
  const s = line.trim().replace(/\*$/, '');
  if (!s.startsWith('$PSSS,')) return null;
  const parts = s.split(',');
  if (parts.length < 7 + SPEC_BINS) return null;
  const status   = parseInt(parts[1], 10);   // 0 = leak alert, 1 = ok
  const snr      = parseFloat(parts[2]);
  const cold_col = parseInt(parts[5], 10);
  const cold_row = parseInt(parts[6], 10);
  const spectrum = new Array(SPEC_BINS);
  for (let i = 0; i < SPEC_BINS; i++) {
    spectrum[i] = parseInt(parts[7 + i], 10);
    if (Number.isNaN(spectrum[i])) return null;
  }
  return { status, snr, cold_col, cold_row, spectrum };
}

function updateUI(packet) {
  const isLeak = packet.status === 0;
  const acousticAlert = packet.snr >= 6;

  if (isLeak) {
    leakBadge.className = 'leak-badge leak';
    leakIcon.textContent = '⚠';
    leakText.textContent = 'LEAK';
  } else {
    leakBadge.className = 'leak-badge';
    leakIcon.textContent = '✓';
    leakText.textContent = 'NO LEAK';
  }

  snrNumber.textContent = Number.isFinite(packet.snr) ? packet.snr.toFixed(1) : '—';
  snrNumber.className = 'snr-number' + (acousticAlert ? ' leak' : '');

  updateSpectrum(packet.spectrum, acousticAlert);

}

function renderLoop() {
  if (thermalDirty && lastTemps) {
    const now = performance.now();
    if (lastRenderAt > 0) {
      const dt = now - lastRenderAt;
      if (dt > 0) thermalFps = 1000 / dt;
    }
    lastRenderAt = now;
    drawThermalCanvas(lastTemps, thermalW, thermalH);
    thermalDirty = false;
    if (typeof thermalTsMs === 'number' && Number.isFinite(thermalTsMs)) {
      const frameAgeMs = Math.max(0, Math.round(Date.now() - thermalTsMs));
      statusText.textContent = `Connected — BLE | ${frameAgeMs} ms | ${thermalFps.toFixed(1)} fps`;
    } else {
      statusText.textContent = `Connected — BLE | ${thermalFps.toFixed(1)} fps`;
    }
  }
  requestAnimationFrame(renderLoop);
}

function setConnected(on) {
  logoDot.className = 'logo-dot' + (on ? ' connected' : '');
  if (on) {
    statusText.textContent = 'Connected — BLE';
  } else {
    statusText.textContent = 'Disconnected';
  }
  btnConnectBle.disabled = on;
  btnDisconnect.disabled = !on;
  if (!on) {
    idleOverlay.classList.remove('hidden');
    snrNumber.textContent = '—';
    updateSpectrum(null, false);
  }
}

function connectBLE() {
  if (wsConn) return;
  statusText.textContent = 'Connecting…';
  wsConn = new WebSocket(WS_URL);
  wsConn.onopen  = () => { console.log('[BLE] WebSocket open'); setConnected(true); };
  wsConn.onclose = (ev) => { console.warn('[BLE] WebSocket closed', ev.code, ev.reason); wsConn = null; setConnected(false); };
  wsConn.onerror = (ev) => { console.error('[BLE] WebSocket error', ev); wsConn = null; setConnected(false); };
  wsConn.onmessage = (ev) => {
    try {
      const d = JSON.parse(ev.data);
      if (!('status' in d)) { console.warn('[BLE] no status field', Object.keys(d)); return; }
      const kind = d.kind || '';
      if ((kind === 'thermal' || !kind) && Number.isFinite(d.thermal_ts_ms)) thermalTsMs = d.thermal_ts_ms;
      if ((kind === 'thermal' || !kind) && d.thermal && Array.isArray(d.thermal)) {
        let w = Number.isInteger(d.thermal_w) ? d.thermal_w : 0;
        let h = Number.isInteger(d.thermal_h) ? d.thermal_h : 0;
        if (w <= 0 || h <= 0 || d.thermal.length !== w * h) {
          if (d.thermal.length === 768) { w = 32; h = 24; }
          else if (d.thermal.length === 192) { w = 16; h = 12; }
        }
        if (w > 0 && h > 0 && d.thermal.length === w * h) {
          lastTemps = d.thermal;
          thermalW = w;
          thermalH = h;
          thermalDirty = true;
        }
      }
      if (kind === 'control' || !kind) {
        updateUI({ status: d.status, snr: d.snr ?? d.value1 ?? 0, spectrum: d.spectrum || [] });
      }
    } catch (err) { console.error('[BLE] parse/render error:', err, ev.data.slice(0, 200)); }
  };
}

function disconnectBLE() {
  if (wsConn) { wsConn.close(); wsConn = null; }
  thermalTsMs = null;
  lastRenderAt = 0;
  thermalFps = 0;
  setConnected(false);
}

btnConnectBle.addEventListener('click', connectBLE);
btnDisconnect.addEventListener('click', disconnectBLE);

drawColorbar(15, 35);
updateSpectrum(null, false);
requestAnimationFrame(renderLoop);
</script>
</body>
</html>
