; PlatformIO Project Configuration — ESP32-S3 BLE bridge for PSSS sensor
;
; Receives binary frames from Teensy 4.1 over UART1 (GPIO5 RX, GPIO6 TX)
; and forwards them to a BLE central (ble_connect.py) via GATT notifications.
;
; Flash: pio run -e esp32s3 -t upload
; Monitor: pio device monitor -e esp32s3

[env:esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; BLEDevice.h is bundled with espressif32 — no extra lib_deps needed

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; XIAO has no USB-UART chip — Serial must go through USB-CDC

monitor_speed = 115200
